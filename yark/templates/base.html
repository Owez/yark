<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basics -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <!-- Title -->
    <title>Yark{% if title %} · {{ title }}{% endif %}</title>
</head>

<body>
    <!-- Styling -->
    <style>
        :root {
            --bg: #f3f8fc;
            --bg-hero: radial-gradient(circle at 15% 10%, rgba(104, 181, 231, 0.24) 0%, rgba(104, 181, 231, 0) 40%), radial-gradient(circle at 90% 0%, rgba(47, 130, 205, 0.2) 0%, rgba(47, 130, 205, 0) 45%);
            --text: #12212d;
            --muted: #445460;
            --surface: rgba(255, 255, 255, 0.86);
            --surface-border: rgba(12, 85, 138, 0.14);
            --surface-strong: rgba(255, 255, 255, 0.95);
            --accent: #2f82cd;
            --accent-soft: rgba(47, 130, 205, 0.13);
            --shadow: 0 16px 40px -22px rgba(9, 57, 89, 0.6);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: var(--text);
            background-color: var(--bg);
            background-image: var(--bg-hero);
            min-height: 100vh;
        }

        nav {
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid var(--surface-border);
            background: var(--surface);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 28px -22px rgba(10, 61, 95, 0.78);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        #nav-title {
            margin-left: 3rem;
            font-size: 110%;
            font-weight: 700;
            letter-spacing: 0.015em;
        }

        #nav-content {
            margin-right: 1.5rem;
            display: flex;
        }

        #nav-content>a,
        .channel-link {
            color: var(--muted);
            margin-right: 1.5rem;
            transition: color 0.15s ease;
        }

        #nav-content>a:hover,
        .channel-link:hover {
            color: var(--accent);
        }

        input[type=text],
        input[type=submit],
        button {
            background-color: var(--surface-strong);
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--surface-border);
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
            box-shadow: 0 10px 26px -20px rgba(10, 57, 87, 0.72);
        }

        input[type=text]:focus,
        button:focus {
            outline: none;
            border-color: rgba(47, 130, 205, 0.45);
            box-shadow: 0 0 0 3px rgba(47, 130, 205, 0.15);
        }

        button:hover,
        input[type=submit]:hover {
            border-color: rgba(47, 130, 205, 0.32);
            background-color: rgba(255, 255, 255, 0.98);
        }

        #error {
            max-width: 15rem;
            background: linear-gradient(135deg, rgba(168, 42, 42, 0.97) 0%, rgba(189, 63, 63, 0.97) 100%);
            color: #fff;
            border-radius: 0.7rem;
            padding: 0.55rem 0.7rem;
            font-size: 0.78rem;
            position: fixed;
            bottom: 0.5rem;
            right: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 16px 40px -20px rgba(119, 34, 34, 0.9);
            white-space: pre-wrap;
        }

        .hero {
            margin-top: 10vh;
            font-size: 2.75rem;
            text-align: center;
            letter-spacing: -0.02em;
        }

        #content {
            margin-left: 10vw;
            width: 80vw;
        }

        .channel-link {
            margin-left: 0.5rem;
            font-size: 95%;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d151d;
                --bg-hero: radial-gradient(circle at 15% 10%, rgba(37, 97, 145, 0.35) 0%, rgba(37, 97, 145, 0) 40%), radial-gradient(circle at 90% 0%, rgba(26, 72, 112, 0.28) 0%, rgba(26, 72, 112, 0) 45%);
                --text: rgb(238, 244, 248);
                --muted: rgb(186, 202, 213);
                --surface: rgba(16, 25, 34, 0.72);
                --surface-strong: rgba(16, 25, 34, 0.9);
                --surface-border: rgba(147, 185, 214, 0.18);
                --accent: #68b5e7;
                --accent-soft: rgba(104, 181, 231, 0.16);
                --shadow: 0 16px 40px -22px rgba(3, 17, 28, 0.88);
            }

            body {
                color: var(--text);
            }

            nav {
                border-bottom-color: var(--surface-border);
            }

            input[type=text],
            input[type=submit],
            button {
                background-color: var(--surface-strong);
                border: 1px solid var(--surface-border);
                color: var(--text);
            }
        }
    </style>
    {% block styling %}{% endblock %}
    <!-- Navbar -->
    <nav>
        <p id="nav-title"><a href="{{ url_for('routes.index') }}">Yark</a></p>
        <div id="nav-content">
            <a title="View the source code of Yark" href="https://github.com/owez/yark">source</a>
            <a title="See more from the author of Yark" href="https://ogriffiths.com">portfolio</a>
        </div>
    </nav>
    <!-- Content -->
    {% block content %}{% endblock %}
    <!-- Flask SSR error -->
    {% if error %}
    <div id="error">{{ error }}</div>
    {% endif %}
    <!-- Global script -->
    <script>
        // Adds an error which will automatically be deleted 
        function addError(msg) {
            let error = document.createElement("div")
            error.setAttribute("id", "error")
            error.innerText = msg
            document.body.appendChild(error)
            deleteError()
        }

        // Starts timer and then automatically deletes element
        function deleteError() {
            let err = document.getElementById("error")
            if (err) {
                setTimeout(
                    function () {
                        err.remove()
                    }, 4000
                )
            }
        }

        // Adds the current channel name to nav title if present 
        function addChannelNav() {
            const path = window.location.pathname
            if (path.startsWith("/channel/")) {
                const channelName = path.split("/")[2]
                let navTitle = document.getElementById("nav-title")
                let channelLink = document.createElement("a")
                channelLink.title = `Go (back) to ${channelName}`
                channelLink.href = `/channel/${channelName}/videos`
                channelLink.appendChild(document.createTextNode(`· ${channelName}`))
                channelLink.classList.add("channel-link")
                navTitle.appendChild(channelLink)
            }
        }

        // Add to nav
        addChannelNav()

        // Flask SSR error deletion
        {% if error %}
        deleteError()
        {% endif %}
    </script>
    <!-- Page-specific scripts -->
    {% block scripts %}{% endblock %}
</body>

</html>
