<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Yark{% if title %} · {{ title }}{% endif %}</title>
</head>

<body>
    <style>
        :root {
            --bg: #f3f8fc;
            --bg-hero: radial-gradient(circle at 15% 10%, rgba(104, 181, 231, 0.26) 0%, rgba(104, 181, 231, 0) 42%),
                        radial-gradient(circle at 90% 0%, rgba(47, 130, 205, 0.18) 0%, rgba(47, 130, 205, 0) 48%);
            --text: #12212d;
            --muted: #445460;
            --surface: rgba(255, 255, 255, 0.84);
            --surface-strong: rgba(255, 255, 255, 0.96);
            --surface-border: rgba(12, 85, 138, 0.13);
            --accent: #2f82cd;
            --accent-soft: rgba(47, 130, 205, 0.12);
            --shadow: 0 12px 32px -18px rgba(9, 57, 89, 0.5);
            --radius: 0.65rem;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            color: var(--text);
            background-color: var(--bg);
            background-image: var(--bg-hero);
            background-attachment: fixed;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        nav {
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid var(--surface-border);
            background: var(--surface);
            backdrop-filter: blur(12px) saturate(1.15);
            box-shadow: 0 1px 4px rgba(10, 61, 95, 0.06),
                        0 8px 24px -18px rgba(10, 61, 95, 0.4);
        }

        #nav-title {
            margin-left: 2.5rem;
            font-size: 110%;
            font-weight: 700;
            letter-spacing: 0.012em;
        }

        #nav-content {
            margin-right: 1.5rem;
            display: flex;
            align-items: center;
        }

        #nav-content > a, .channel-link {
            color: var(--muted);
            margin-right: 1.5rem;
            font-size: 0.9rem;
            transition: color 0.15s ease;
        }

        #nav-content > a:hover, .channel-link:hover { color: var(--accent); }

        .channel-link { margin-left: 0.4rem; font-size: 95%; }

        input[type="text"], input[type="submit"], button {
            font-family: inherit;
            font-size: 0.88rem;
            background: var(--surface-strong);
            padding: 0.5rem 0.65rem;
            border-radius: 0.4rem;
            border: 1px solid var(--surface-border);
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus, button:focus-visible {
            outline: none;
            border-color: rgba(47, 130, 205, 0.45);
            box-shadow: 0 0 0 3px rgba(47, 130, 205, 0.12);
        }

        button { cursor: pointer; }
        button:hover { border-color: rgba(47, 130, 205, 0.3); }
        button:active { transform: scale(0.985); }

        #error {
            max-width: 18rem;
            background: linear-gradient(135deg, #b83a3a 0%, #c94a4a 100%);
            color: #fff;
            border-radius: 0.6rem;
            padding: 0.55rem 0.75rem;
            font-size: 0.78rem;
            position: fixed;
            bottom: 0.75rem;
            right: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 32px -16px rgba(119, 34, 34, 0.85);
            white-space: pre-wrap;
            z-index: 999;
            animation: errorIn 0.3s ease;
        }

        @keyframes errorIn {
            from { opacity: 0; transform: translateY(0.5rem); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero {
            margin-top: 10vh;
            font-size: 2.75rem;
            text-align: center;
            letter-spacing: -0.02em;
            font-weight: 700;
        }

        #content { margin-left: 10vw; width: 80vw; }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d151d;
                --bg-hero: radial-gradient(circle at 15% 10%, rgba(37, 97, 145, 0.38) 0%, rgba(37, 97, 145, 0) 42%),
                            radial-gradient(circle at 90% 0%, rgba(26, 72, 112, 0.26) 0%, rgba(26, 72, 112, 0) 48%);
                --text: #eaf1f7;
                --muted: #b0c2d1;
                --surface: rgba(16, 25, 34, 0.7);
                --surface-strong: rgba(16, 25, 34, 0.9);
                --surface-border: rgba(147, 185, 214, 0.16);
                --accent: #68b5e7;
                --accent-soft: rgba(104, 181, 231, 0.14);
                --shadow: 0 12px 32px -18px rgba(3, 17, 28, 0.75);
            }
        }

        @media screen and (max-width: 700px) {
            #content { margin-left: 5vw; width: 90vw; }
            .hero { margin-top: 6vh; font-size: 2rem; }
            #nav-title { margin-left: 1rem; }
            #nav-content { margin-right: 0.75rem; }
            #nav-content > a, .channel-link { margin-right: 0.75rem; font-size: 0.82rem; }
        }
    </style>

    {% block styling %}{% endblock %}

    <nav>
        <p id="nav-title"><a href="{{ url_for('routes.index') }}">Yark</a></p>
        <div id="nav-content">
            <a title="View the source code of Yark" href="https://github.com/owez/yark" target="_blank" rel="noopener">Source</a>
            <a title="See more from the author of Yark" href="https://ogriffiths.com" target="_blank" rel="noopener">Portfolio</a>
        </div>
    </nav>

    {% block content %}{% endblock %}

    {% if error %}
    <div id="error">{{ error }}</div>
    {% endif %}

    <script>
        function addError(msg) {
            const el = document.createElement("div");
            el.id = "error";
            el.innerText = msg;
            document.body.appendChild(el);
            dismissError();
        }

        function dismissError() {
            const err = document.getElementById("error");
            if (!err) return;
            setTimeout(() => {
                err.style.opacity = "0";
                err.style.transition = "opacity 0.4s ease";
                setTimeout(() => err.remove(), 400);
            }, 5000);
        }

        (function addChannelNav() {
            const path = window.location.pathname;
            if (!path.startsWith("/channel/")) return;
            const name = path.split("/")[2];
            const nav = document.getElementById("nav-title");
            const link = document.createElement("a");
            link.className = "channel-link";
            link.title = `Go to ${name}`;
            link.href = `/channel/${name}/videos`;
            link.textContent = `· ${name}`;
            nav.appendChild(link);
        })();

        {% if error %}dismissError();{% endif %}
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
